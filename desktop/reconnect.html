<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Tinting-JD — Reconectando</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 { margin: 0; font-size: 20px; }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid #334155;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin: 0; font-size: 15px; color: #94a3b8; text-align: center; max-width: 420px; line-height: 1.5; }
      .actions { display: flex; gap: 12px; margin-top: 8px; }
      button, a {
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        border: none;
        text-decoration: none;
      }
      button { color: #fff; background: #6366f1; }
      button:hover { background: #4f46e5; }
      a { color: #cbd5e1; background: #1e293b; border: 1px solid #334155; }
      a:hover { background: #334155; }
    </style>
  </head>
  <body>
    <h1>Tinting-JD</h1>
    <div class="spinner"></div>
    <p id="msg">Conectando a la base de datos…</p>
    <div class="actions">
      <button id="retry">Reintentar</button>
      <a id="configure" href="#">Configurar conexión…</a>
    </div>
    <script src="reconnect.js"></script>
  </body>
</html>
