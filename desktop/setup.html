<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Configurar Tinting-JD</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        width: 100%;
        max-width: 560px;
        padding: 40px 36px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; font-size: 14px; color: #94a3b8; line-height: 1.5; }
      code { color: #cbd5e1; background: #0f172a; padding: 1px 5px; border-radius: 4px; }
      label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
      textarea {
        width: 100%;
        min-height: 96px;
        padding: 12px 14px;
        font-size: 13px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        color: #e2e8f0;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        outline: none;
        resize: vertical;
      }
      textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #6366f1;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover { background: #4f46e5; }
      button:disabled { opacity: 0.6; cursor: default; }
      .error { margin: 0 0 16px; font-size: 13px; color: #f87171; }
      .error:empty { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tinting-JD</h1>
      <p>Ingresa la cadena de conexión de MongoDB (Atlas). El programa arranca su propio servidor local y se conecta a esta base de datos.</p>
      <div class="error" id="error"></div>
      <label for="uri">Cadena de conexión</label>
      <textarea id="uri" placeholder="mongodb+srv://usuario:clave@cluster.../erp_contabilidad" spellcheck="false" autocomplete="off"></textarea>
      <button id="save">Guardar y abrir</button>
    </div>
    <script src="setup.js"></script>
  </body>
</html>
